<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d2e" />
    <title>Troopers</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>⚜️ Troopers</h1>
      <span id="net" class="badge">online</span>
    </header>

    <main>
      <section class="card">
        <label for="base">API base URL</label>
        <input id="base" value="http://localhost:3000" />
        <label for="token">API token</label>
        <input id="token" placeholder="dev-leader" value="dev-leader" />
        <button id="load">Load roster &amp; reminders</button>
        <p id="status" class="muted">Not loaded.</p>
      </section>

      <section class="card">
        <h2>Registration reminders</h2>
        <ul id="reminders" class="list"><li class="muted">—</li></ul>
      </section>

      <section class="card">
        <h2>Roster</h2>
        <ul id="roster" class="list"><li class="muted">—</li></ul>
      </section>
    </main>

    <footer class="muted">
      Installable PWA shell · works offline (cached) · PRD §5.16
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
